name: forge-portal CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Python deps
        run: python -m pip install -r requirements-dev.txt

      - name: Node deps
        run: npm ci

      # ---- python gates --------------------------------------------------
      - name: Ruff
        run: ruff check portal_core tests scripts e2e

      - name: Python tests (server + security matrix)
        run: python -m pytest tests/ -q

      # ---- frontend gates ------------------------------------------------
      - name: Format check
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Typecheck + build (strict, strictTemplates)
        run: npx ng build --configuration production

      - name: Unit tests (vitest)
        run: npx ng test --watch=false

      - name: i18n parity
        run: python scripts/check_i18n.py

      # ---- browser e2e ---------------------------------------------------
      - name: Chromium
        run: python -m playwright install chromium --with-deps

      - name: Browser E2E (real server + real bundle)
        run: python -m pytest e2e/ -q

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          retention-days: 14

      # ---- distribution gates -------------------------------------------
      - name: Vendored parity (7 destinations)
        run: python scripts/vendor.py --check

      - name: HTTP e2e (all forges, when siblings are checked out)
        if: github.event_name == 'push'
        run: python scripts/portal_e2e.py || true
